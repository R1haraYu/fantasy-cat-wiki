name: Build offline Wiki APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: "0.8.1"
      TAG: "v0.8.1"
      MIN_APP_VERSION: "0.8.1"
      CHANGELOG: |
        版本徽章改为软件版本号
        更新前弹窗确认
        增量更新只下载变更文件
        更新日志显示
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site manifest
        run: |
          python apk/tools/build_site_manifest.py \
            --site . \
            --version "${VERSION}" \
            --exclude apk --exclude .github --exclude .git \
            --out apk/app/src/main/assets/site_manifest.json

      - name: Build APK
        run: |
          gradle -p apk \
            -PwikiSiteDir=../.. \
            -PupdateManifestUrl="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
            assembleDebug

      - name: Stage APK
        run: |
          mkdir -p build-release
          cp apk/app/build/outputs/apk/debug/app-debug.apk build-release/app-debug.apk

      - name: Build site zip + latest.json
        run: |
          python apk/tools/make_release.py \
            --site . \
            --version "${VERSION}" \
            --exclude apk --exclude .github --exclude .git \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${TAG}" \
            --out build-release \
            --apk build-release/app-debug.apk \
            --apk-name app-debug.apk \
            --changelog "${CHANGELOG}" \
            --min-app-version "${MIN_APP_VERSION}"

      - name: Verify release hashes and wiki-only scope
        run: |
          python apk/tools/verify_release.py --release build-release
          python apk/tools/check_scope.py --release build-release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Wiki ${{ env.VERSION }}"
          body: |
            Offline wiki APK and hash-verified update package.
          files: |
            build-release/app-debug.apk
            build-release/wiki-site-${{ env.VERSION }}.zip
            build-release/site_manifest.json
            build-release/latest.json
