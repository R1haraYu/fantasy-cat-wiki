<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>怪物图鉴 · 幻想之都的黑猫</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .monster-board {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 36px;
      align-items: start;
    }
    .monster-list input {
      width: 100%;
      margin-bottom: 12px;
      padding: 8px 10px;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      background: #fff;
    }
    .monster-list button {
      display: block;
      width: 100%;
      margin: 0 0 2px;
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .monster-list button.on, .monster-list button:hover { background: #f6e7d4; }
    .monster-head { display: flex; gap: 20px; align-items: flex-end; }
    .monster-art { width: min(280px, 46vw); height: auto; }
    .monster-detail h2 {
      margin: 0;
      font-family: "Palatino Linotype", "Songti SC", serif;
      font-size: 40px;
      font-weight: 600;
    }
    .section {
      margin: 26px 0 8px;
      font-size: 13px;
      letter-spacing: 0.16em;
      color: var(--accent);
    }
    .loc { margin: 0 0 16px; }
    .loc-place { margin: 0; color: var(--muted); font-size: 13px; }
    .loc-line { display: flex; gap: 14px; align-items: baseline; margin: 2px 0 8px; }
    .loc-mode { flex: none; width: 2.5em; color: var(--muted); font-size: 13px; }
    .loc-codes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      margin: 0;
      font-size: 22px;
      line-height: 1.7;
    }
    .skill { margin: 0 0 14px; }
    .skill h3 { margin: 0 0 2px; font-size: 18px; }
    .skill p { margin: 0; }
    @media (max-width: 800px) {
      .monster-board { grid-template-columns: 1fr; }
      .monster-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

  <script>
    const monsters = JSON.parse(document.getElementById("monsters").textContent);
    const list = document.getElementById("list");
    const detail = document.getElementById("detail");
    let current = monsters[0] ? monsters[0].name : "";

    function esc(text) {
      return String(text).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
    }
    function show(name) {
      current = name;
      const monster = monsters.find((item) => item.name === name);
      document.querySelectorAll(".monster-list button").forEach((button) => {
        button.classList.toggle("on", button.dataset.name === name);
      });
      if (!monster) {
        detail.innerHTML = "";
        return;
      }
      const art = monster.image ? '<img class="monster-art" src="' + esc(monster.image) + '" alt="">' : "";
      const epithet = monster.epithets.length ? '<p class="meta">' + monster.epithets.map(esc).join(" · ") + "</p>" : "";
      const locs = monster.groups.map((group) => {
        const head = group.kind === "冒险者委托"
          ? "冒险者委托 · " + group.place
          : (group.place && group.kind !== "主线" ? group.place + " · " + group.kind : (group.place || group.kind));
        const lines = group.modes.map((mode) => {
          const label = mode.name ? '<span class="loc-mode">' + esc(mode.name) + "</span>" : "";
          return '<p class="loc-line">' + label + '<span class="loc-codes">' +
            mode.codes.map((code) => "<span>" + esc(code) + "</span>").join("") + "</span></p>";
        }).join("");
        return '<div class="loc"><p class="loc-place">' + esc(head) + "</p>" + lines + "</div>";
      }).join("");
      const skills = monster.skills.map((skill) =>
        '<article class="skill"><h3>' + esc(skill.name) + "</h3><p>" + esc(skill.desc) + "</p></article>"
      ).join("");
      detail.innerHTML =
        '<div class="monster-head">' + art + "<div><h2>" + esc(monster.name) + "</h2>" + epithet + "</div></div>" +
        (locs ? '<h3 class="section">出现地点</h3>' + locs : "") +
        (skills ? '<h3 class="section">技能</h3>' + skills : "");
    }
    function render(query) {
      const word = query.trim();
      list.innerHTML = "";
      monsters.filter((monster) => !word || monster.name.includes(word)).forEach((monster) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.name = monster.name;
        button.textContent = monster.name;
        button.addEventListener("click", () => show(monster.name));
        list.appendChild(button);
      });
      const visible = [...list.querySelectorAll("button")];
      if (!visible.some((button) => button.dataset.name === current) && visible[0]) current = visible[0].dataset.name;
      show(current);
    }
    document.getElementById("q").addEventListener("input", (event) => render(event.target.value));
    render("");
  </script>
